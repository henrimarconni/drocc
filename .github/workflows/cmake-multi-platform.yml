name: Cross-Platform CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        
        include:
          - os: ubuntu-latest
            exe_ext: ""
            lib_prefix: "lib"
            lib_ext: ".so"
          - os: windows-latest
            exe_ext: ".exe"
            lib_prefix: ""
            lib_ext: ".dll"
          - os: macos-latest
            exe_ext: ""
            lib_prefix: "lib"
            lib_ext: ".dylib"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Install Latest CMake & Ninja via Pip
        run: pip install --upgrade cmake ninja

      - name: Configure CMake
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build Project
        run: cmake --build build

      - name: Run sgrun Tests
        shell: bash 
        run: |
          shopt -s nullglob
          
          TEST_LIBS=(build/*_tests/*${{ matrix.lib_ext }})
          
          if [ ${#TEST_LIBS[@]} -eq 0 ]; then
            echo "Error: No test libraries found"
            exit 1
          fi

          for lib in "${TEST_LIBS[@]}"; do
            ./build/sgrun/sgrun${{ matrix.exe_ext }} "$lib"
          done
